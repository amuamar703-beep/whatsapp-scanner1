services:
  - type: web
    name: whatsapp-scanner-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      playwright install chromium
      playwright install-deps
      mkdir -p logs storage/exports
    startCommand: python -m app.main
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-scanner-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: whatsapp-scanner-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: ADMIN_IDS
        sync: false
      - key: DB_POOL_SIZE
        value: 5
      - key: DB_MAX_OVERFLOW
        value: 10
      - key: WORKER_CONCURRENCY
        value: 3
      - key: GLOBAL_RATE_LIMIT
        value: 50
      - key: PER_USER_RATE_LIMIT
        value: 15

  - type: worker
    name: whatsapp-scanner-worker
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      playwright install chromium
      playwright install-deps
      mkdir -p logs storage/exports
    startCommand: python -m app.worker_main
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-scanner-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: whatsapp-scanner-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: DB_POOL_SIZE
        value: 5
      - key: DB_MAX_OVERFLOW
        value: 10
      - key: WORKER_CONCURRENCY
        value: 3
      - key: GLOBAL_RATE_LIMIT
        value: 50
      - key: PER_USER_RATE_LIMIT
        value: 15

databases:
  - name: whatsapp-scanner-db
    databaseName: whatsapp_scanner
    user: scanner
    plan: free
    region: frankfurt
    ipAllowList: []

redis:
  - name: whatsapp-scanner-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
