services:
  - type: web
    name: whatsapp-scanner-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: |
      pip install --upgrade pip
      pip install --no-cache-dir -r requirements.txt
      mkdir -p logs storage/exports
    startCommand: python -m app.main
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-scanner-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: whatsapp-scanner-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: ADMIN_IDS
        sync: false

  - type: worker
    name: whatsapp-scanner-worker
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: |
      pip install --upgrade pip
      pip install --no-cache-dir -r requirements.txt
      mkdir -p logs storage/exports
    startCommand: python -m app.worker_main
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-scanner-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: whatsapp-scanner-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: whatsapp-scanner-db
    databaseName: whatsapp_scanner
    user: scanner
    plan: free
    region: frankfurt
    ipAllowList: []

redis:
  - name: whatsapp-scanner-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
